[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  VITE_BACKEND_URL = "https://ppms-project-1.onrender.com"
  VITE_API_BASE_URL = "https://ppms-project-1.onrender.com/api"
  VITE_AUTH_BASE_URL = "https://ppms-project-1.onrender.com/auth"
